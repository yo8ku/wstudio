<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor Test</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      background: #1e1e1e;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    import * as monaco from 'monaco-editor';
    
    console.log('[Test] Monaco object:', monaco);
    
    try {
      const editor = monaco.editor.create(document.getElementById('container'), {
        value: '# Hello Monaco!\n\nThis is a test.',
        language: 'markdown',
        theme: 'vs-dark',
        automaticLayout: true
      });
      
      console.log('[Test] Editor created successfully:', editor);
    } catch (error) {
      console.error('[Test] Failed to create editor:', error);
      document.body.innerHTML = `<div style="color: white; padding: 20px;">
        <h1>Error creating Monaco Editor</h1>
        <pre>${error.message}\n${error.stack}</pre>
      </div>`;
    }
  </script>
</body>
</html>
