<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 高亮调试</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    body {
      background: #002b36;
      color: #839496;
      font-family: 'Consolas', 'Monaco', monospace;
      padding: 20px;
    }
    
    pre {
      background: #073642;
      padding: 20px;
      border-radius: 4px;
      margin: 20px 0;
    }
    
    /* 测试选择器 */
    .hljs.language-json .hljs-attr,
    .language-json .hljs-attr,
    code.language-json .hljs-attr {
      color: #268bd2 !important;
      font-weight: 500;
    }
    
    .debug-info {
      background: #073642;
      padding: 10px;
      margin: 10px 0;
      border-left: 3px solid #268bd2;
    }
  </style>
</head>
<body>
  <h1>JSON 高亮调试工具</h1>
  
  <div class="debug-info">
    <h3>测试 JSON 代码：</h3>
  </div>
  
  <pre><code class="hljs language-json">{
  "names": [
    "tom": {
      "age": "18",
      "address": "重庆市秀山县"
    }
  ]
}</code></pre>

  <div class="debug-info">
    <h3>查看生成的 HTML 结构：</h3>
    <button onclick="showHTML()">显示 HTML</button>
    <pre id="html-output" style="background: #073642; padding: 10px; display: none;"></pre>
  </div>

  <script>
    // 使用 highlight.js 高亮代码
    document.addEventListener('DOMContentLoaded', () => {
      const codeBlock = document.querySelector('code.language-json');
      const result = hljs.highlight(codeBlock.textContent, { language: 'json' });
      codeBlock.innerHTML = result.value;
      
      // 显示调试信息
      console.log('高亮结果:', result);
      console.log('生成的 HTML:', codeBlock.innerHTML);
      
      // 检查 .hljs-attr 元素
      const attrs = codeBlock.querySelectorAll('.hljs-attr');
      console.log('找到的 .hljs-attr 元素:', attrs);
      attrs.forEach((attr, index) => {
        console.log(`元素 ${index}:`, {
          text: attr.textContent,
          computedStyle: window.getComputedStyle(attr).color,
          classes: attr.className
        });
      });
    });
    
    function showHTML() {
      const codeBlock = document.querySelector('code.language-json');
      const output = document.getElementById('html-output');
      output.textContent = codeBlock.innerHTML;
      output.style.display = 'block';
    }
  </script>
</body>
</html>
